# TooieRecomp — N64Recomp input using dumped symbols (P04+).
# Schema mirrors BanjoRecomp/banjo.us.rev0.toml with Tooie paths.

[input]
entrypoint = 0x80000400
output_func_path = "RecompiledFuncs"
rom_file_path = "decomp/decompressed.us.z64"
symbols_file_path = "metadata/tooie.us.syms.toml"
relocatable_sections_path = "metadata/relocatable_sections.txt"
bss_section_suffix = "_bss"
unpaired_lo16_warnings = true

# Optional data reference for patches (P04+):
