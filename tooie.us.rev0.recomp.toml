# Recomp config (P04): kit-free generation. Input = decompressed ROM + committed symbols file (no ELF).
# metadata/tooie.us.syms.toml is the lossless N64Recomp context dump of the decomp ELF (tools/generate_metadata.py, maintainer-only); it needs the
# patched generator (vendor/patches-local/n64recomp-symbols-file-fidelity.patch). `rom_name` keeps the former get_rom_name() string.
[input]
entrypoint = 0x80000400
output_func_path = "RecompiledFuncs"
rom_file_path = "decomp/decompressed.us.z64"
symbols_file_path = "metadata/tooie.us.syms.toml"
rom_name = "banjotooie_decompressed.z64"
relocatable_sections_path = "metadata/relocatable_sections.recomp.txt"
bss_section_suffix = "_bss"
unpaired_lo16_warnings = true

[patches]
ignored = []
renamed = []
stubs = [
    "boot___osCleanupThread",
    "boot___osDisableInt",
    "boot___osDispatchThread",
    "boot___osEnqueueAndYield",
    "boot___osEnqueueThread",
    "boot___osException",
    "boot___osExceptionPreamble",
    "boot___osGetCause",
    "boot___osGetSR",
    "boot___osPopThread",
    "boot___osProbeTLB",
    "boot___osRestoreInt",
    "boot___osSetFpcCsr",
    "boot___osSetSR",
    "boot_handle_CpU",
    "boot_osInvalICache",
    "boot_osMapTLBRdb",
    "boot_osUnmapTLBAll",
    "boot_osWritebackDCache",
    "func_80013B70",
    "func_8001DDC0",
    "ovl_entrypoint_alternate"
]
