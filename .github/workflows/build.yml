# TooieRecomp build/validate. Authored locally; NEVER dispatched from the authoring host.
# The game itself cannot be built on public runners: RecompiledFuncs is generated from the owner's private ROM.
#  - public jobs (no ROM): tracked-tree audit (vendored sources, no gitlinks/ROM/generated code), offline vendor verify, host unit tests (Linux + Windows/clang-cl)
#  - all sources are vendored in the repository: no bootstrap, no submodule, no download beyond OS packages
#  - private job: self-hosted runner that already holds the ROM at $TOOIE_ROM; uploads checksums/audit only (never the game archive)
name: build
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  public-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang lld pkg-config libsdl2-dev libfreetype-dev libgtk-3-dev
      - name: Audit tracked tree (no ROM / ELF / generated game code / gitlinks / oversized blobs)
        run: |
          ! git ls-files | grep -Ei '\.(z64|n64|v64|elf|rom|sav|eep)$|(^|/)(baserom\.us\.z64|decompressed\.)'
          ! git ls-files | grep -E '^RecompiledFuncs/'
          ! git ls-files -s | grep -E '^160000'
          test ! -e .gitmodules
          ! git ls-files -s | awk '$1=="120000"' | grep .
          git ls-files -z | xargs -0 stat -c '%s %n' | awk '$1 > 52428800 {print; bad=1} END {exit bad}'
      - name: Vendored sources (offline integrity + patch chain present)
        run: tools/vendor_verify.sh --reverse-check
      - name: Configure with an EMPTY placeholder for generated code (CI-only, host tests only)
        run: |
          mkdir -p RecompiledFuncs && echo 'int tooie_ci_placeholder;' > RecompiledFuncs/ci_placeholder.c
          cmake -S . -B build-ci -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
      - name: Host unit tests
        run: |
          T="tooie_menu_policy_test tooie_menu_config_test rt64_host_endpoint_current_test p09_interp_burst_test p09_world_interpolation_guard_test p09_local_pair_snapshot_test p09_exact_use_correlation_test rt64_present_decimator_test"
          cmake --build build-ci --target $T -j2
          for t in $T; do (cd build-ci && ./$t); done

  public-windows:   # informational until proven on a native Windows host (see tools/windows/README.md)
    runs-on: windows-2022
    continue-on-error: true
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
        with: { arch: x64 }
      - run: tools/vendor_verify.sh
      - name: Configure (placeholder generated code) and build host tests
        run: |
          mkdir -p RecompiledFuncs && echo 'int tooie_ci_placeholder;' > RecompiledFuncs/ci_placeholder.c
          cmake -S . -B build-ci -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ci --target tooie_menu_policy_test rt64_host_endpoint_current_test p09_world_interpolation_guard_test -j2

  private-game-build:   # needs a self-hosted runner you control; ROM never leaves it
    if: ${{ vars.TOOIE_PRIVATE_RUNNER == 'true' }}
    runs-on: [self-hosted, linux, x64, tooie-rom]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build and package (TOOIE_ROM must be set in the runner environment)
        run: tools/build_linux.sh
      - name: Upload checksums and audit only (the archive embeds ROM-derived code)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tooie-linux-private-evidence
          path: |
            dist/*.sha256
            dist/*/AUDIT.txt
            dist/*/BUILD-INFO.txt
            dist/*/DEPENDENCIES.txt
